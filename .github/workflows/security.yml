name: Secret, privacy, and dependency security

on:
  push:
  pull_request:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-safety:
    name: Public-safety scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Scan publishable source
        run: python scripts/scan_public_safety.py .

  gitleaks:
    name: Gitleaks history scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ARCHIVE_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" "$url"
          echo "$GITLEAKS_ARCHIVE_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --status
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP" gitleaks

      - name: Scan Git history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .

  python-dependencies:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install audit tool
        run: python -m pip install --disable-pip-version-check "pip-audit>=2.9.0,<3.0.0"

      - name: Audit development requirements
        run: python -m pip_audit -r requirements-dev.txt

      - name: Audit bridge requirements when present
        run: |
          if [[ -f bridge/requirements.txt ]]; then
            python -m pip_audit -r bridge/requirements.txt
          fi
