services:
  bridge:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ./data:/data
    secrets:
      - coinbase_api_key_name
      - coinbase_api_private_key
    # Loopback-only publication. Put a TLS reverse proxy in front before
    # exposing this service beyond the host.
    ports:
      - "127.0.0.1:8788:8788"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/healthz', timeout=2).read()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

secrets:
  coinbase_api_key_name:
    file: ./secrets/coinbase_api_key_name
  coinbase_api_private_key:
    file: ./secrets/coinbase_api_private_key
