[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "coinbase-amoled-bridge"
version = "1.0.0"
description = "Read-only device bridge for an unofficial Coinbase AMOLED terminal"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Coinbase AMOLED Bridge contributors"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "cryptography>=42.0.0,<49",
]

[project.scripts]
coinbase-amoled-bridge = "coinbase_amoled_bridge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests", "scripts"]
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
# S### (bandit) codes are applied by an external security review, not by ruff
# here; declaring them external keeps the defensive `# noqa: S###` markers from
# being reported as unused.
external = ["S"]
